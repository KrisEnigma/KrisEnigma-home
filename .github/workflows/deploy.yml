name: Deploy to krisenigma.com

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout home repository
      uses: actions/checkout@v4
      with:
        path: home
        
    - name: Checkout gamelist repository
      uses: actions/checkout@v4
      with:
        repository: KrisEnigma/KrisEnigma-gamelist
        path: gamelist
        token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        
    - name: Checkout deployment repository
      uses: actions/checkout@v4
      with:
        repository: KrisEnigma/krisenigma.com
        path: deployment
        token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: latest

    - name: Build Astro project (home)
      run: |
        cd home
        pnpm install
        pnpm run build

    - name: Build Next.js project (gamelist)
      run: |
        cd gamelist
        pnpm install
        pnpm run build

    - name: Prepare deployment directory
      run: |
        cd deployment
        # Remove all files except .git
        find . -maxdepth 1 ! -name '.git' ! -name '.' -exec rm -rf {} +

    - name: Copy home build to deployment
      run: |
        cp -r home/dist/* deployment/

    - name: Copy gamelist build to deployment
      run: |
        if [ -d "gamelist/out/gamelist" ]; then
          cp -r gamelist/out/gamelist deployment/
        else
          mkdir -p deployment/gamelist
          cp -r gamelist/out/* deployment/gamelist/
        fi

    - name: Create Cloudflare configuration
      run: |
        cd deployment
        
        # Create _headers
        cat > _headers << 'EOF'
        /*
          X-Frame-Options: DENY
          X-Content-Type-Options: nosniff
          Referrer-Policy: strict-origin-when-cross-origin
          Permissions-Policy: geolocation=(), microphone=(), camera=()

        /gamelist/*
          Cache-Control: public, max-age=31536000, immutable

        /_next/static/*
          Cache-Control: public, max-age=31536000, immutable

        /assets/*
          Cache-Control: public, max-age=31536000, immutable
        EOF
        
        # Create _routes.json
        cat > _routes.json << 'EOF'
        {
          "version": 1,
          "include": ["/*"],
          "exclude": []
        }
        EOF

    - name: Deploy to GitHub
      run: |
        cd deployment
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        git diff --staged --quiet || git commit -m "🚀 Auto-deploy from home repository - $(date '+%Y-%m-%d %H:%M:%S')"
        git push
