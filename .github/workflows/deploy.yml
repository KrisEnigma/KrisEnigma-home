name: Deploy home to krisenigma.com

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout home repository
      uses: actions/checkout@v4
      with:
        path: home
        
    - name: Checkout deployment repository
      uses: actions/checkout@v4
      with:
        repository: KrisEnigma/krisenigma.com
        path: deployment
        token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        
    - name: Setup pnpm
      uses: pnpm/action-setup@v2
      with:
        version: latest

    - name: Build Astro project (home)
      env:
        PUBLIC_GTAG_ID: ${{ secrets.PUBLIC_GTAG_ID }}
      run: |
        cd home
        pnpm install
        pnpm run build

    - name: Copy home build to deployment
      run: |
        cd deployment
        find . -maxdepth 1 ! -name '.git' ! -name '.' ! -name 'gamelist' -exec rm -rf {} +
        cp -r ../home/dist/* .

    - name: Deploy to GitHub
      run: |
        cd deployment
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        git add .
        git diff --staged --quiet || git commit -m "🚀 Auto-deploy home - $(date '+%Y-%m-%d %H:%M:%S')"
        git push
